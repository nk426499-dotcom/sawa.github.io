    <link rel="stylesheet" href="style.css">

<body>
    <header>
        <h1>My Portfolio</h1>
    </header>
    
    <nav class="menu-bar">
        <a href="index.html">Home</a>
        <a href="portfolio.html">Portfolio</a>

    <div class="container">
        <aside class="left-sidebar">
            <h3>Useful Links</h3>

        </aside>

        <main class="main-content">
            <h2>BMI Calculator</h2>
            <p>Enter your height and weight to calculate your BMI.</p>
            <div id="trivia-container">
                <label>Height (cm): <input type="number" id="input1"></label><br><br>
                <label>Weight (kg): <input type="number" id="input2"></label><br><br>
                <button onclick="calculateTrivia()">Calculate BMI</button>
                <p id="trivia-result">Your BMI will be displayed here.</p>
            </div>
        </main>

        <aside class="right-sidebar">
            <h3>Contact Me</h3>
            <form id="contact-form" onsubmit="return validateForm()">
                <input type="text" id="name" placeholder="Your Name">
                <textarea id="message" placeholder="Your Message"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </aside>
    </div>
